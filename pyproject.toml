[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blip16"
version = "1.0.0"
description = "A pixel-art groovebox, generative radio and music player that lives in your terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "boxiboy" }]
keywords = ["synthesizer", "sequencer", "drum machine", "generative music", "terminal", "tui", "curses", "vocoder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console :: Curses",
    "Topic :: Multimedia :: Sound/Audio :: Sound Synthesis",
    "Topic :: Multimedia :: Sound/Audio :: Players",
]
dependencies = ["numpy>=1.22", "sounddevice>=0.4"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyflakes>=3"]

[project.scripts]
blip16 = "blip16.ui:cli"

[project.urls]
Homepage = "https://github.com/boxiboy/BLIP16"
Issues = "https://github.com/boxiboy/BLIP16/issues"

[tool.setuptools]
packages = ["blip16"]

[tool.pytest.ini_options]
testpaths = ["tests"]
